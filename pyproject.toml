[build-system]
requires = ["setuptools>=78"]
build-backend = "setuptools.build_meta"

[project]
name = "local-aigc-detectors"
version = "0.3.0"
description = "Offline Chinese AIGC detectors with Python, CLI and localhost HTTP interfaces"
requires-python = ">=3.11"
dependencies = ["torch>=2.6", "transformers==4.57.6", "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1"]

[project.scripts]
aigc-detect = "aigc_detector.cli:main"

[tool.setuptools.packages.find]
include = ["aigc_detector*"]

[tool.setuptools.package-data]
aigc_detector = ["profiles/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.pytest-tmp"
