[build-system]
requires = ["setuptools>=78"]
build-backend = "setuptools.build_meta"

[project]
name = "local-aigc-detectors"
dynamic = ["version"]
description = "Offline Chinese and English AIGC detectors with Python, CLI and localhost HTTP interfaces"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
aigc-detect = "aigc_detector.cli:main"

[project.optional-dependencies]
inference = ["torch>=2.10,<3", "transformers==5.22.1"]
http = ["local-aigc-detectors[inference]", "fastapi>=0.115,<1", "uvicorn>=0.34,<1"]
statistical = ["local-aigc-detectors[inference]", "accelerate==1.15.0", "psutil==7.2.2"]

[tool.setuptools.packages.find]
include = ["aigc_detector*"]

[tool.setuptools.package-data]
aigc_detector = ["profiles/*.json", "resource_manifest.json"]

[tool.setuptools.dynamic]
version = {attr = "aigc_detector.__version__"}

[tool.setuptools.data-files]
"share/local-aigc-detectors/.agents/skills/aigc-detect" = [".agents/skills/aigc-detect/SKILL.md"]
"share/local-aigc-detectors/.agents/skills/aigc-detect/agents" = [".agents/skills/aigc-detect/agents/openai.yaml"]
"share/local-aigc-detectors/user_doc" = ["user_doc/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.pytest-tmp"
